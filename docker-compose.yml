services:
  app:
    build: .
    container_name: reservation-salles-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: reservation_salles
      DB_USERNAME: reservation_user
      DB_PASSWORD: reservation_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: reservation-salles-db
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "reservation_user", "-preservation_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
