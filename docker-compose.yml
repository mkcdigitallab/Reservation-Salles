services:
  app:
    build: .
    container_name: reservation-salles-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-reservation_salles}
      DB_USERNAME: ${DB_USERNAME:-reservation_user}
      DB_PASSWORD: ${DB_PASSWORD:-reservation_password}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: reservation-salles-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
      MYSQL_USER: ${DB_USERNAME:-reservation_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reservation_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
