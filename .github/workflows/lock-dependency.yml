name: Refresh Composer lock

on:
  push:
    branches:
      - feature/security-tests-scripts

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Refresh lock file
        run: composer update respect/validation --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: verrouiller respect validation"
          git push origin HEAD:${GITHUB_REF_NAME}
