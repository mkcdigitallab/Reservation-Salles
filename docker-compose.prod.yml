services:
  app:
    image: mkdigitlab/reservation-salles:1.1
    container_name: reservation-salles-app

    ports:
      - "8000:8000"

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mkdigitlab/reservation-salles-db:1.0
    container_name: reservation-salles-db

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
