services:
  app:
    image: mkcdigitallab/reservation-salles:1.0
    container_name: reservation-salles-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: reservation_salles
      DB_USERNAME: reservation_user
      DB_PASSWORD: reservation_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mkcdigitallab/reservation-salles-db:1.0
    container_name: reservation-salles-db
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "reservation_user", "-preservation_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
